<style>
  /* ekip-portre-ray — Kalabalık ekip tek satırda gezilir (yatay ray, kaydırma yaslaması); sinematik koyu sunum. */
  .modulex-ekip-portre-ray { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ekip-portre-ray *, .modulex-ekip-portre-ray *::before, .modulex-ekip-portre-ray *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ekip-portre-ray :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ekip-portre-ray :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ekip-portre-ray :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ekip-portre-ray :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ekip-portre-ray img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ekip-portre-ray) img { height: auto; }
  .modulex-ekip-portre-ray [hidden] { display: none !important; }
  .modulex-ekip-portre-ray :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ekip-portre-ray :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ekip-portre-ray-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ekip-portre-ray-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ekip-portre-ray--bassiz .modulex-ekip-portre-ray-bas { display: none; }
  .modulex-ekip-portre-ray-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ekip-portre-ray-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ekip-portre-ray-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ekip-portre-ray-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-ekip-portre-ray-ust { grid-column: 1 / -1; }
  .modulex-ekip-portre-ray-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ekip-portre-ray-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ekip-portre-ray-dugme:hover { transform: translateY(-2px); }
  .modulex-ekip-portre-ray-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ekip-portre-ray-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ekip-portre-ray-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ekip-portre-ray-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 290px); gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block-end: 4px; }
  .modulex-ekip-portre-ray-ray::-webkit-scrollbar { display: none; }
  .modulex-ekip-portre-ray-kart { display: grid; align-content: start; gap: 14px; scroll-snap-align: start; }
  .modulex-ekip-portre-ray-foto { width: 100%; aspect-ratio: 3 / 4; border-radius: --yuvarlak--; object-fit: cover; font-size: 3rem; filter: grayscale(0.35); transition: filter 0.5s ease; }
  .modulex-ekip-portre-ray-kart:hover .modulex-ekip-portre-ray-foto { filter: none; }
  .modulex-ekip-portre-ray-yazi { display: grid; gap: 4px; }
  .modulex-ekip-portre-ray-bio { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.9rem; }
  .modulex-ekip-portre-ray-kontrol { display: flex; justify-content: flex-end; gap: 10px; margin-block-start: 22px; }
  .modulex-ekip-portre-ray-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: --text--; transition: background-color 0.25s ease, opacity 0.25s ease; }
  .modulex-ekip-portre-ray-ok:hover:not(:disabled) { background-color: --accent--; color: --accentText--; }
  .modulex-ekip-portre-ray-ok:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 768px) {
    .modulex-ekip-portre-ray-ray { grid-auto-columns: 78%; }
    .modulex-ekip-portre-ray-kontrol { justify-content: center; }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-portre-ray) img { height: auto; }
  .modulex-ekip-portre-ray-foto { min-width: 0; }
  .modulex-ekip-portre-ray-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-portre-ray-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-portre-ray-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-portre-ray-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-portre-ray-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-portre-ray-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-portre-ray-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-portre-ray-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-portre-ray-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-portre-ray-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-portre-ray-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-portre-ray-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-portre-ray :is(.modulex-ekip-portre-ray-baslik, .modulex-ekip-portre-ray-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-portre-ray-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-ekip-portre-ray-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-ekip-portre-ray { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-portre-ray *, .modulex-ekip-portre-ray *::before, .modulex-ekip-portre-ray *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-portre-ray";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
