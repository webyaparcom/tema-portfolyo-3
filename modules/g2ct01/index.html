<section class="modulex-iletisim-kart-izgara{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-kart-izgara-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-kart-izgara — iletisim-kartlari'nin yatay şeridinden farklı: ortalı başlık altında kare oranlı, havadar kartlar; saat de kart olur. */
  .modulex-iletisim-kart-izgara { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-kart-izgara *, .modulex-iletisim-kart-izgara *::before, .modulex-iletisim-kart-izgara *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-kart-izgara :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-kart-izgara :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-kart-izgara :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-kart-izgara :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-kart-izgara img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-kart-izgara) img { height: auto; }
  .modulex-iletisim-kart-izgara [hidden] { display: none !important; }
  .modulex-iletisim-kart-izgara :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-kart-izgara :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-kart-izgara-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-kart-izgara-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-kart-izgara--bassiz .modulex-iletisim-kart-izgara-bas { display: none; }
  .modulex-iletisim-kart-izgara-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-kart-izgara-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-kart-izgara-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-kart-izgara-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-iletisim-kart-izgara-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-kart-izgara-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-kart-izgara-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-kart-izgara-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-kart-izgara-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-kart-izgara-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-kart-izgara-izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
  .modulex-iletisim-kart-izgara-kart { display: grid; align-content: start; gap: 10px; padding: 28px 24px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.5s ease; }
  .modulex-iletisim-kart-izgara-kart:hover { transform: translateY(-4px); box-shadow: 0 16px 40px color-mix(in srgb, --text-- 10%, transparent); }
  .modulex-iletisim-kart-izgara-kart .modulex-iletisim-kart-izgara-kikon { margin-block-end: 8px; }
  .modulex-iletisim-kart-izgara-kart .modulex-iletisim-kart-izgara-eylem { margin-block-start: auto; padding-block-start: 8px; }
  .modulex-iletisim-kart-izgara-kart .modulex-iletisim-kart-izgara-deger { font-size: 1.08rem; }
  .modulex-iletisim-kart-izgara--hazir:not(.modulex-iletisim-kart-izgara--gor) .modulex-iletisim-kart-izgara-kart { opacity: 0; transform: translateY(16px); }
  .modulex-iletisim-kart-izgara--gor .modulex-iletisim-kart-izgara-kart { transition-delay: calc(var(--i, 0) * 80ms); }
  @media (max-width: 768px) {
    .modulex-iletisim-kart-izgara-izgara { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .modulex-iletisim-kart-izgara-kart { padding: 20px; }
  }
  .modulex-iletisim-kart-izgara-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-kart-izgara-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-kart-izgara-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-kart-izgara-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-kart-izgara-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-kart-izgara-eylem:hover { gap: 10px; }
  .modulex-iletisim-kart-izgara-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-kart-izgara-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-kart-izgara--kjs .modulex-iletisim-kart-izgara-kopya { display: inline-flex; }
  .modulex-iletisim-kart-izgara-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-kart-izgara-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-kart-izgara--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-kart-izgara-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-kart-izgara-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-kart-izgara-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-kart-izgara-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-kart-izgara-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-kart-izgara-cikon { font-size: 18px; }
  .modulex-iletisim-kart-izgara-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-kart-izgara-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-kart-izgara-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-kart-izgara-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-kart-izgara-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-kart-izgara-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-kart-izgara-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-kart-izgara-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-kart-izgara-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-kart-izgara :is(.modulex-iletisim-kart-izgara-baslik, .modulex-iletisim-kart-izgara-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-kart-izgara-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-kart-izgara { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-kart-izgara *, .modulex-iletisim-kart-izgara *::before, .modulex-iletisim-kart-izgara *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-kart-izgara";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
