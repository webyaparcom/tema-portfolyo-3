<style>
  /* deger-ray — Değerleri bir galeri gibi gezdirir (ray); görsel taşıyabilen kartlarla medya destekli değer anlatımı. */
  .modulex-deger-ray { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-deger-ray *, .modulex-deger-ray *::before, .modulex-deger-ray *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-deger-ray :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-deger-ray :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-deger-ray :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-deger-ray :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-deger-ray img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-deger-ray) img { height: auto; }
  .modulex-deger-ray [hidden] { display: none !important; }
  .modulex-deger-ray :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-deger-ray :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-deger-ray-ic { max-width: --max--; margin-inline: auto; }
  .modulex-deger-ray-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-deger-ray--bassiz .modulex-deger-ray-bas { display: none; }

  .modulex-deger-ray-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-deger-ray-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-deger-ray-ust { grid-column: 1 / -1; }
  .modulex-deger-ray-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-deger-ray-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-deger-ray-dugme:hover { transform: translateY(-2px); }
  .modulex-deger-ray-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-deger-ray-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-deger-ray-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-deger-ray-ray { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 360px); gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .modulex-deger-ray-ray::-webkit-scrollbar { display: none; }
  .modulex-deger-ray-kart { position: relative; display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-radius: --yuvarlak--; background: --kartBg--; scroll-snap-align: start; transition: transform 0.3s ease; }
  .modulex-deger-ray-kart:hover { transform: translateY(-4px); }
  .modulex-deger-ray-medya { display: grid; place-items: center; aspect-ratio: 16 / 10; overflow: hidden; background: color-mix(in srgb, --accent-- 16%, --kartBg--); }
  .modulex-deger-ray-medya img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
  .modulex-deger-ray-kart:hover .modulex-deger-ray-medya img { transform: scale(1.06); }
  .modulex-deger-ray-ikon { color: --accentInk--; font-size: 64px; }
  .modulex-deger-ray-yazi { display: grid; align-content: start; gap: 8px; padding: 22px; }
  .modulex-deger-ray-etiket { color: --accentInk--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-deger-ray-kbaslik { font-size: 1.2rem; font-weight: 700; }
  .modulex-deger-ray-kmetin { color: --muted--; font-size: 0.95rem; }
  .modulex-deger-ray-kontrol { display: flex; justify-content: flex-end; gap: 10px; margin-block-start: 18px; }
  .modulex-deger-ray-ok { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: --text--; transition: background 0.25s ease, opacity 0.25s ease; }
  .modulex-deger-ray-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; border-color: --accent--; }
  .modulex-deger-ray-ok:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 768px) {
    .modulex-deger-ray-ray { grid-auto-columns: 82%; }
  }
  .modulex-deger-ray-bag { color: inherit; text-decoration: none; }
  .modulex-deger-ray-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-ray-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-ray :is(.modulex-deger-ray-baslik, .modulex-deger-ray-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-ray-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-deger-ray-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-deger-ray { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-ray *, .modulex-deger-ray *::before, .modulex-deger-ray *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-ray";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ray = (s, P) => {
        const ray = s.querySelector("." + P + "-ray");
        if (!ray) return;
        const dugme = [...s.querySelectorAll("[data-ray]")];
        const durum = () => {
          const max = ray.scrollWidth - ray.clientWidth - 2;
          const x = Math.abs(ray.scrollLeft);
          dugme.forEach((b) => { b.disabled = max <= 0 || (b.dataset.ray === "geri" ? x <= 2 : x >= max); });
        };
        dugme.forEach((b) => b.addEventListener("click", () => {
          const ilk = ray.firstElementChild;
          const adim = (ilk ? ilk.getBoundingClientRect().width : ray.clientWidth * 0.8) + 16;
          const rtl = getComputedStyle(ray).direction === "rtl";
          ray.scrollBy({ left: (b.dataset.ray === "ileri" ? 1 : -1) * (rtl ? -1 : 1) * adim, behavior: "smooth" });
        }));
        ray.addEventListener("scroll", durum, { passive: true });
        durum();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ray(s, P, az);
    });
  })();
</script>
